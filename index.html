<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10253a">
  <title>PDE Visual Lab｜偏微分方程可视化</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#182b3d;background:#f3f6f9}
    *{box-sizing:border-box} body{margin:0} button,input{font:inherit} button{cursor:pointer}
    .shell{max-width:1250px;margin:auto;padding:24px}
    header{background:#10253a;color:white;border-radius:22px;padding:27px 32px;display:flex;justify-content:space-between;align-items:center;gap:15px}
    h1{font-size:clamp(25px,3vw,38px);margin:2px 0 6px} h2{font-size:24px;margin:0 0 10px} h3{font-size:16px;margin:0 0 12px}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:#75d9df} header p{color:#c6d8e7;margin:0} .badge{border:1px solid #668196;border-radius:50px;padding:8px 13px;white-space:nowrap;font-size:13px}
    .layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;margin-top:20px}
    aside,.panel{background:white;border:1px solid #dfe8ef;border-radius:20px;box-shadow:0 9px 27px #213c5810}
    aside{padding:20px;align-self:start} aside h3{color:#566b7e;font-size:13px} .menu{display:grid;gap:8px}
    .menu button{width:100%;border:0;border-radius:11px;text-align:left;padding:12px 14px;background:transparent;color:#344c61}
    .menu button.active{color:#045f68;background:#e0f4f3;font-weight:800}
    .side-note{font-size:13px;line-height:1.7;color:#65798b;border-top:1px solid #e6edf1;margin-top:22px;padding-top:18px}
    main{min-width:0} .panel{padding:24px;margin-bottom:18px}.lead{color:#586d7e;line-height:1.7;margin:0 0 15px}
    .equation{font-size:clamp(17px,2.3vw,23px);font-family:Cambria,"Times New Roman",serif;background:#edf7f8;border-left:4px solid #16a2a7;padding:16px;border-radius:10px;overflow-x:auto;white-space:nowrap}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
    .control label{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:8px}
    input[type=range]{width:100%;accent-color:#159b9f;cursor:pointer} .control small{color:#687e8c}
    .actions{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
    .action{background:#10253a;color:white;border:0;border-radius:10px;padding:9px 16px} .action.secondary{background:#e9f1f4;color:#19374a}
    .plots{display:grid;grid-template-columns:1fr;gap:16px} .plots.double{grid-template-columns:repeat(2,minmax(0,1fr))}
    .chartbox{background:#fbfdfe;border:1px solid #e4ebf0;border-radius:14px;padding:12px;min-width:0}
    .chartbox h3{font-size:15px;margin:3px 4px 6px} svg{display:block;width:100%;height:auto;background:white;border-radius:9px}
    .legend{display:flex;gap:16px;flex-wrap:wrap;color:#5d7182;font-size:12px;margin:8px 4px 0}
    .swatch{width:18px;height:3px;display:inline-block;vertical-align:middle;margin-right:5px;border-radius:3px}
    .explain{line-height:1.8;color:#42576b;margin:0} .explain strong{color:#153f53}
    .result{padding:13px 16px;border-radius:11px;background:#eaf8f3;color:#18594c;line-height:1.7;margin-top:15px}
    .result.warn{background:#fff1e8;color:#884526} .steps{margin:15px 0 0;padding-left:22px;line-height:1.9;color:#42576b}
    .footnote{text-align:center;color:#728597;font-size:13px;margin:22px 0}
    [hidden]{display:none!important} button:focus-visible,input:focus-visible{outline:3px solid #eeaa52;outline-offset:2px}
    @media(max-width:830px){.layout{grid-template-columns:1fr}aside{padding:14px}.menu{grid-template-columns:repeat(2,1fr)}.side-note{display:none}.plots.double{grid-template-columns:1fr}}
    @media(max-width:530px){.shell{padding:10px}header{padding:20px;align-items:start}.badge{display:none}.panel{padding:17px}.controls{grid-template-columns:1fr}.menu button{font-size:13px;padding:10px}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div><div class="eyebrow">INTERACTIVE MATHEMATICS</div><h1>∂ PDE Visual Lab</h1><p>拖动时间，亲眼看见偏微分方程的解如何变化。</p></div><div class="badge">无需安装 · 离线可用</div></header>
    <div class="layout">
      <aside><h3>选择一个方程</h3><nav class="menu" aria-label="方程列表">
        <button type="button" data-topic="transport" class="active" aria-current="page">01 · 输运方程</button>
        <button type="button" data-topic="burgers">02 · Burgers 方程</button>
        <button type="button" data-topic="heat">03 · 热方程</button>
        <button type="button" data-topic="wave">04 · 波动方程</button>
      </nav><div class="side-note">建议从输运方程开始，再看 Burgers 方程的特征线为何会相交。所有曲线都由浏览器直接计算。</div></aside>
      <main>
        <section class="panel">
          <h2 id="title"></h2><p class="lead" id="summary"></p><div class="equation" id="equation"></div>
          <div class="controls">
            <div class="control"><label for="time">时间 t <span id="time-value"></span></label><input id="time" type="range" min="0" max="3" step="0.02" value="0.6"><small id="time-hint"></small></div>
            <div class="control" id="parameter-control"><label for="parameter"><span id="parameter-label"></span><span id="parameter-value"></span></label><input id="parameter" type="range" step="0.05"><small id="parameter-hint"></small></div>
            <div class="control" id="position-control" hidden><label for="position">指定位置 x <span id="position-value"></span></label><input id="position" type="range" min="-3" max="3" step="0.05" value="0.50"><small>反推经过 (x,t) 的特征线从哪里出发</small></div>
          </div>
          <div class="actions"><button class="action" id="play" type="button">▶ 播放演化</button><button class="action secondary" id="reset" type="button">重置</button><small id="play-hint">也可以直接拖动时间滑块</small></div>
        </section>
        <section class="panel"><div class="plots" id="plots"><div class="chartbox"><h3 id="chart-title"></h3><svg id="chart" viewBox="0 0 600 330" role="img" aria-label="解随位置变化的曲线"></svg><div class="legend"><span><i class="swatch" style="background:#aab9c5"></i>初值</span><span><i class="swatch" style="background:#118b96"></i>当前时刻</span></div></div>
          <div class="chartbox" id="second-box" hidden><h3>特征线：横轴为 x，纵轴为 t</h3><svg id="second-chart" viewBox="0 0 600 330" role="img" aria-label="Burgers 方程的特征线图"></svg><div class="legend"><span><i class="swatch" style="background:#118b96"></i>特征线</span><span><i class="swatch" style="background:#eb8a3b"></i>当前时刻</span></div></div></div>
          <div id="result" class="result" role="status"></div></section>
        <section class="panel"><h3>看图时记住这三步</h3><p class="explain" id="explain"></p><ol class="steps" id="steps"></ol></section>
      </main>
    </div>
    <div class="footnote">本项目展示指定初值的解析公式；Burgers 方程在激波产生后不计算熵弱解。</div>
  </div>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const PI = Math.PI;
    const model = {
      gaussian: x => Math.exp(-((x / 0.7) ** 2)),
      transport: (x, t, c) => Math.exp(-(((x - c * t) / 0.7) ** 2)),
      burgers0: xi => -Math.sin(xi),
      burgersX: (xi, t) => xi - t * Math.sin(xi),
      heat: (x, t, k) => Math.exp(-k*t)*Math.sin(x)+0.5*Math.exp(-4*k*t)*Math.sin(2*x),
      wave: (x, t, c) => (Math.exp(-(((x-c*t)/0.7)**2))+Math.exp(-(((x+c*t)/0.7)**2)))/2,
      burgersFoot(x,t) {
        if (t < 0 || t >= 1 || x < -PI || x > PI) throw new RangeError('只有 t<1 时可反求唯一初始点');
        let lo=-PI, hi=PI;
        for(let i=0;i<60;i++){const mid=(lo+hi)/2; if(this.burgersX(mid,t)<x) lo=mid; else hi=mid;}
        return (lo+hi)/2;
      }
    };
    const topics = {
      transport: {title:'输运方程：波形怎样移动？',summary:'一个波包按固定速度移动，形状不变。',equation:'uₜ + c uₓ = 0　　u(x,0) = exp[−(x/0.7)²]',max:3,initial:.6,parameter:{label:'传播速度 c',min:-2,max:2,value:1,hint:'正值向右移动，负值向左移动'},explain:'<strong>关键：</strong>沿直线 x=ξ+ct，函数值保持不变。要计算指定位置的 u(x,t)，先找到它的起点 ξ=x−ct。',steps:['在初始时刻选择一点 ξ。','沿特征线移动到 x=ξ+ct。','把初始值带过去：u(x,t)=u₀(x−ct)。']},
      burgers: {title:'Burgers 方程：特征线为何相交？',summary:'传播速度等于解自身，因此不同初始点移动得快慢不同。',equation:'uₜ + u uₓ = 0　　u(x,0) = −sin(x)',max:1.6,initial:.4,explain:'<strong>关键：</strong>起点 ξ 的特征线是 x=ξ−t sin ξ，线上 u=−sin ξ。求 u(x,t) 要先由 x 和 t 反求 ξ。',steps:['拖动时间，看特征线逐渐聚集。','在 t<1 时选定 x，应用反求 ξ 并算出 u(x,t)。','t=1 首次出现梯度爆破；更晚的参数曲线可能折返，不能当作单值经典解。']},
      heat: {title:'热方程：起伏如何变平？',summary:'波动越密集的部分，衰减越快。',equation:'uₜ = κ uₓₓ　　u(x,0) = sin x + ½ sin(2x)',max:5,initial:1,parameter:{label:'扩散系数 κ',min:.05,max:1,value:.3,hint:'κ 越大，扩散越快'},explain:'<strong>关键：</strong>把初值分成两个正弦模态。sin x 的系数按 e^(−κt) 衰减，sin(2x) 按 e^(−4κt) 衰减。',steps:['比较灰色初值和蓝色当前解。','增大 κ 或 t，观察波峰降低。','第二个模态频率是两倍，衰减指数里的系数是四倍。']},
      wave: {title:'波动方程：脉冲如何分开？',summary:'初始脉冲分成向左和向右传播的两部分。',equation:'uₜₜ = c² uₓₓ　　u(x,0)=exp[−(x/0.7)²], uₜ(x,0)=0',max:3,initial:1,parameter:{label:'波速 c',min:.2,max:2,value:1,hint:'调大波速，两束波分开得更快'},explain:'<strong>关键：</strong>零初速度时，达朗贝尔公式给出两束波的平均：u(x,t)=[f(x−ct)+f(x+ct)]/2。',steps:['t=0 时两束波重合，正好是完整的初位移。','时间增大后，一束向右，一束向左。','每一束的振幅各占初脉冲的一半。']}
    };
    const state={topic:'transport',playing:false,frame:0,last:0};
    function textNode(name, attrs={}, content='') {
      const el=document.createElementNS('http://www.w3.org/2000/svg',name);
      for (const [key,value] of Object.entries(attrs)) el.setAttribute(key,String(value));
      if(content) el.textContent=content;
      return el;
    }
    function chart(svg,{xmin,xmax,ymin,ymax,xticks,yticks,xlabel,ylabel}){
      svg.replaceChildren(); const W=600,H=330, L=52,R=14,T=16,B=40;
      const px=x=>L+(x-xmin)*(W-L-R)/(xmax-xmin);
      const py=y=>H-B-(y-ymin)*(H-T-B)/(ymax-ymin);
      const add=el=>svg.appendChild(el);
      for(const x of xticks){add(textNode('line',{x1:px(x),y1:T,x2:px(x),y2:H-B,stroke:'#e9eef1'}));add(textNode('text',{x:px(x),y:H-17,'text-anchor':'middle',fill:'#65798b','font-size':12},String(x)));}
      for(const y of yticks){add(textNode('line',{x1:L,y1:py(y),x2:W-R,y2:py(y),stroke:'#e9eef1'}));add(textNode('text',{x:L-9,y:py(y)+4,'text-anchor':'end',fill:'#65798b','font-size':12},String(y)));}
      add(textNode('rect',{x:L,y:T,width:W-L-R,height:H-T-B,fill:'none',stroke:'#bdcbd5'}));
      add(textNode('text',{x:W-R,y:H-3,'text-anchor':'end',fill:'#587083','font-size':12},xlabel));
      add(textNode('text',{x:8,y:T+8,fill:'#587083','font-size':12},ylabel));
      function curve(points,color,width=2.8,dash=''){
        const d=points.map(([x,y],i)=>(i?'L':'M')+px(x).toFixed(2)+' '+py(y).toFixed(2)).join(' ');
        add(textNode('path',{d,fill:'none',stroke:color,'stroke-width':width,'stroke-dasharray':dash,'stroke-linecap':'round','stroke-linejoin':'round'}));
      }
      function dot(x,y,color){add(textNode('circle',{cx:px(x),cy:py(y),r:5,fill:color,stroke:'#fff','stroke-width':2}));}
      return {curve,dot};
    }
    function sample(a,b,n,fn){return Array.from({length:n+1},(_,i)=>{const x=a+(b-a)*i/n;return [x,fn(x)];});}
    function number(value){return Number(value).toFixed(2);}
    function stop(){state.playing=false;cancelAnimationFrame(state.frame);$('play').textContent='▶ 播放演化';}
    function selectTopic(topic){
      if(!topics[topic])return;
      stop();state.topic=topic;const info=topics[topic];
      for(const button of document.querySelectorAll('[data-topic]')){const active=button.dataset.topic===topic;button.classList.toggle('active',active);if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');}
      $('title').textContent=info.title;$('summary').textContent=info.summary;$('equation').textContent=info.equation;
      $('explain').innerHTML=info.explain;$('steps').replaceChildren(...info.steps.map(s=>{const li=document.createElement('li');li.textContent=s;return li;}));
      $('time').max=info.max;$('time').value=info.initial;$('time-hint').textContent=`范围：0 到 ${info.max}`;
      $('parameter-control').hidden=!info.parameter;$('position-control').hidden=topic!=='burgers';
      if(info.parameter){$('parameter-label').textContent=info.parameter.label;$('parameter-hint').textContent=info.parameter.hint;Object.assign($('parameter'),{min:info.parameter.min,max:info.parameter.max,value:info.parameter.value});}
      $('position').value=.5;$('second-box').hidden=topic!=='burgers';$('plots').classList.toggle('double',topic==='burgers');
      draw();
    }
    function draw(){
      const t=Number($('time').value),p=Number($('parameter').value),topic=state.topic;
      $('time-value').textContent=number(t);$('parameter-value').textContent=number(p);$('position-value').textContent=number($('position').value);
      const svg=$('chart'); let g,result;
      if(topic==='burgers'){
        $('chart-title').textContent=t>=1?'参数曲线（折返部分不是经典解）':'解的曲线：横轴为 x，纵轴为 u';
        g=chart(svg,{xmin:-3.7,xmax:3.7,ymin:-1.35,ymax:1.35,xticks:[-3,-2,-1,0,1,2,3],yticks:[-1,0,1],xlabel:'x',ylabel:'u'});
        g.curve(sample(-PI,PI,520,x=>-Math.sin(x)),'#aab9c5',2,'6 5');
        g.curve(sample(-PI,PI,520,xi=>-Math.sin(xi)).map(([xi,u])=>[model.burgersX(xi,t),u]),'#118b96');
        const x=Number($('position').value);
        if(t<1){const foot=model.burgersFoot(x,t),u=model.burgers0(foot);g.dot(x,u,'#eb8a3b');result=`在 (x,t)=(${number(x)}, ${number(t)})，初始点 ξ≈${foot.toFixed(4)}；因此 u(x,t)=−sin ξ≈${u.toFixed(4)}。`;}
        else result='t≥1：特征映射在 ξ=0 附近不再处处可逆。图中蓝线只是参数曲线，不能读作单值的全局经典解；这里没有计算激波后的弱解。';
        const s=chart($('second-chart'),{xmin:-3.8,xmax:3.8,ymin:0,ymax:1.6,xticks:[-3,-2,-1,0,1,2,3],yticks:[0,.5,1,1.5],xlabel:'x',ylabel:'t'});
        for(let j=0;j<=26;j++){const xi=-PI+2*PI*j/26;s.curve(sample(0,1.6,50,time=>model.burgersX(xi,time)).map(([time,pos])=>[pos,time]),'#6db4b8',1.25);}
        s.curve([[-3.8,t],[3.8,t]],'#eb8a3b',2.5,'6 5');s.curve([[-3.8,1],[3.8,1]],'#e35c55',1.4,'3 5');
        if(t<1)s.dot(x,t,'#eb8a3b');
      } else {
        const periodic=topic==='heat',xmin=periodic?-PI:-6,xmax=periodic?PI:6;
        const ymin=periodic?-1.6:-.15,ymax=periodic?1.6:1.15;
        $('chart-title').textContent='灰色是初始波形，蓝色是当前时刻';
        g=chart(svg,{xmin,xmax,ymin,ymax,xticks:periodic?[-3,-2,-1,0,1,2,3]:[-6,-4,-2,0,2,4,6],yticks:periodic?[-1,0,1]:[0,.5,1],xlabel:'位置 x',ylabel:'u'});
        const init=x=>periodic?model.heat(x,0,p):model.gaussian(x);
        const now=x=>topic==='heat'?model.heat(x,t,p):topic==='wave'?model.wave(x,t,p):model.transport(x,t,p);
        g.curve(sample(xmin,xmax,480,init),'#aab9c5',2,'6 5');g.curve(sample(xmin,xmax,480,now),'#118b96');
        result=topic==='transport'?`传播距离 c·t = ${number(p*t)}。曲线只发生平移，波峰高度不变。`:topic==='heat'?`一倍频剩余 ${Math.exp(-p*t).toFixed(3)}，二倍频剩余 ${Math.exp(-4*p*t).toFixed(3)}（均相对于各自初始系数）。`:`左右两个波峰的中心分别位于 x≈${number(-p*t)} 与 x≈${number(p*t)}。`;
      }
      $('result').textContent=result;$('result').classList.toggle('warn',topic==='burgers'&&t>=1);
    }
    function animate(stamp){if(!state.playing)return;if(!state.last)state.last=stamp;const elapsed=(stamp-state.last)/1000;state.last=stamp;const input=$('time');let next=Number(input.value)+elapsed*Number(input.max)/6;if(next>Number(input.max))next=0;input.value=next;draw();state.frame=requestAnimationFrame(animate);}
    for(const button of document.querySelectorAll('[data-topic]'))button.addEventListener('click',()=>selectTopic(button.dataset.topic));
    for(const id of ['time','parameter','position'])$(id).addEventListener('input',draw);
    $('play').addEventListener('click',()=>{if(state.playing){stop();return;}state.playing=true;state.last=0;$('play').textContent='❚❚ 暂停';state.frame=requestAnimationFrame(animate);});
    $('reset').addEventListener('click',()=>selectTopic(state.topic));
    selectTopic('transport');
  </script>
</body>
</html>
